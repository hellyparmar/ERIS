# alembic.ini — Alembic configuration file
# MSc Data Science Project: Enterprise Retail Intelligence System

[alembic]
# Path to migration scripts
script_location = alembic

# Template for revision file names
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration files
timezone = UTC

# Maximum length of slug (tail of revision file name)
truncate_slug_length = 40

# Revision environment; read DATABASE_URL from environment via env.py
# (do NOT hardcode credentials here)
sqlalchemy.url = 

[post_write_hooks]
# none configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
