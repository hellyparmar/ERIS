services:
  - type: web
    name: eris-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ERIS_SEED_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_AI_ASSISTANT
        value: "true"
      - key: USE_OLLAMA
        value: "false"
      - key: GROQ_API_KEY
        sync: false
