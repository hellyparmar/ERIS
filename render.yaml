# Render Blueprint: a free hosted ERIS demo (https://render.com -> New -> Blueprint -> pick this repository).
# The demo database is prepared while the image is built (see the Dockerfile), so the service starts in seconds
# with data, forecasts and page answers ready. The free plan has no persistent disk: changes made in the demo are
# lost when the service restarts or sleeps. For a lasting deployment attach PostgreSQL and set DATABASE_URL.
services:
  - type: web
    name: eris
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_DAYS
        value: "730"
      - key: SEED_OUTLETS
        value: "5"
      - key: LLM_ENABLED  # no Ollama on the free plan; the assistant uses its built-in engine
        value: "false"
      - key: MALLOC_ARENA_MAX  # keeps memory well inside the free plan's 512 MB
        value: "2"
      # If the web app is also hosted on Vercel (VITE_API_URL pointing here), allow its address:
      # - key: CORS_ORIGINS
      #   value: https://your-project.vercel.app
