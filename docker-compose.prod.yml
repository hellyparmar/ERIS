version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: rdios_postgres
    environment:
      POSTGRES_USER: rdios_user
      POSTGRES_PASSWORD: rdios_secure_password_2026
      POSTGRES_DB: enterprise_retail_db
      POSTGRES_INITDB_ARGS: "-c max_connections=100"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - rdios_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdios_user -d enterprise_retail_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rdios_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rdios_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rdios_backend
    environment:
      # Database
      DATABASE_URL: postgresql://rdios_user:rdios_secure_password_2026@postgres:5432/enterprise_retail_db
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # JWT Secrets
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_jwt_secret_key_change_in_production}
      POS_JWT_SECRET_KEY: ${POS_JWT_SECRET_KEY:-your_pos_jwt_secret_key_change_in_production}
      
      # WhatsApp
      MSG91_API_KEY: ${MSG91_API_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-R-DIOS}
      
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # CORS
      CORS_ORIGINS: http://localhost:5173,http://frontend:3000
      
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./logs:/app/logs
    networks:
      - rdios_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rdios_celery_worker
    environment:
      DATABASE_URL: postgresql://rdios_user:rdios_secure_password_2026@postgres:5432/enterprise_retail_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MSG91_API_KEY: ${MSG91_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./api:/app/api
      - ./logs:/app/logs
    networks:
      - rdios_network
    restart: unless-stopped
    command: celery -A api.tasks.celery_app worker -l info --concurrency=4

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: rdios_frontend
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    networks:
      - rdios_network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: rdios_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - rdios_network
    restart: unless-stopped

networks:
  rdios_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
