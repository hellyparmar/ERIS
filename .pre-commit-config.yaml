repos:
  # ----------------------------------------------------------------
  # gitleaks - blocks commits that contain secrets
  # Docs: https://github.com/gitleaks/gitleaks
  # ----------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ----------------------------------------------------------------
  # detect-secrets - secondary scanner (different ruleset)
  # To update baseline:  detect-secrets scan > .secrets.baseline
  # ----------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Lock files contain package integrity hashes. Example files and
        # notebooks remain scanned because both can contain live keys.
        exclude: '(?i)(^|/)package-lock\.json$'
