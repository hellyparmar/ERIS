# Dependency updates arrive as pull requests that CI tests, instead of surprising a later build.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: monthly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
