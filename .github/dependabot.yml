# Dependency updates arrive as pull requests that CI tests, instead of surprising a later build.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: monthly }
    groups:
      python: { patterns: ["*"] }
    # The tested runtime is Python 3.11 (CI, Dockerfile). numpy 2.5 has no 3.11 wheel, so it is held (D23).
    ignore:
      - dependency-name: numpy
        versions: [">=2.5"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    # Python stays on 3.11 until the runtime is moved on purpose, with the full suite run (D23).
    ignore:
      - dependency-name: python
        versions: [">=3.12"]
