name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master, phase-1-cleanup]

jobs:
  gitleaks:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits in the PR

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  detect-secrets:
    name: detect-secrets Baseline Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Check files against baseline
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
