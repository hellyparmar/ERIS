name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master, phase-1-cleanup]

jobs:
  gitleaks:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits in the PR

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-secrets:
    name: detect-secrets Baseline Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan for new secrets against baseline
        run: |
          detect-secrets scan --baseline .secrets.baseline
          # Exit non-zero if new secrets were found outside the baseline
          detect-secrets audit .secrets.baseline --report --only-allowlisted || true
          python -c "
          import json, sys
          with open('.secrets.baseline') as f:
              b = json.load(f)
          new = [r for v in b['results'].values() for r in v if not r.get('is_verified', False) and not r.get('is_secret', False)]
          if new:
              print(f'FAIL: {len(new)} unverified secret(s) found', file=sys.stderr)
              sys.exit(1)
          print('OK: no new secrets detected')
          "
