name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            api/constraints.txt
      # constraints.txt pins the exact versions the suite was verified with (no surprise upgrades)
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check app tests
      - run: pytest -q

  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eris
          POSTGRES_PASSWORD: eris
          POSTGRES_DB: eris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eris -d eris_test"
          --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://eris:eris@localhost:5432/eris_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            api/constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t eris .
      # the image must start, create its schema and answer on $PORT (demo generation is skipped to keep CI fast)
      - run: |
          docker run -d --name eris -p 8080:8080 -e PORT=8080 -e SEED_DEMO_DATA=false \
            -e JWT_SECRET_KEY=ci-only-secret-0123456789-0123456789-abcdef eris
          for i in $(seq 60); do curl -fs http://localhost:8080/api/health && exit 0; sleep 2; done
          docker logs eris; exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            api/constraints.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: pip install -r api/requirements.txt -c api/constraints.txt
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
