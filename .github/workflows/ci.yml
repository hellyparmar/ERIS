name: CI

on:
  push:
  pull_request:

# Least privilege: jobs can read the code and nothing else - no writes, no secrets (none are referenced), and
# checkout leaves no git credentials behind for later steps. Actions are pinned to commits (Dependabot bumps them).
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            api/constraints.txt
      # constraints.txt pins the exact versions the suite was verified with (no surprise upgrades)
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check app tests
      - run: pytest -q

  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eris
          POSTGRES_PASSWORD: eris
          POSTGRES_DB: eris_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eris -d eris_test"
          --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://eris:eris@localhost:5432/eris_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            api/constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with: { persist-credentials: false }
      # the build also prepares the demo database (data, forecasts, page answers): a few minutes
      - run: docker build -t eris .
      # the image must start fast with the demo ready: sign in and get the dashboard from the prepared answers.
      # It runs as on a small host (512 MB) with no Linux capabilities, and the server may not change its own code.
      - run: |
          docker run -d --name eris -p 8080:8080 -e PORT=8080 --memory 512m --cap-drop ALL \
            --security-opt no-new-privileges -e JWT_SECRET_KEY=ci-only-secret-0123456789-0123456789-abcdef eris
          for i in $(seq 60); do curl -fs http://localhost:8080/api/health && break; sleep 2; done
          # sign in with the demo admin the image lists for its sign-in page (no password in this file)
          curl -fs http://localhost:8080/api/auth/demo-accounts \
            | python3 -c "import sys,json;a=next(x for x in json.load(sys.stdin) if x['email']=='admin@eris.demo');print(json.dumps({'email':a['email'],'password':a['password']}))" > login.json
          token=$(curl -fs http://localhost:8080/api/auth/login -H 'content-type: application/json' -d @login.json \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -fsS -D headers.txt -o dashboard.json -H "Authorization: Bearer $token" "http://localhost:8080/api/dashboard?period=30d"
          grep -i "x-cache: hit" headers.txt
          python3 -c "import json;d=json.load(open('dashboard.json'));assert d['kpis']['current']['orders']>1000, d['kpis']"
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          docker exec eris sh -c 'test "$(id -u)" != 0 && ! touch /app/api/app/probe 2>/dev/null && touch /app/api/data/probe'
      - if: failure()
        run: docker logs eris

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            api/constraints.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: pip install -r api/requirements.txt -c api/constraints.txt
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
