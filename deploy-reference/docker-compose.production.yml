version: '3.9'

services:
  # ============================================================================
  # Backend FastAPI Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PYTHON_VERSION: "3.13"
    container_name: eris-backend-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      SQLALCHEMY_ECHO: "false"
      
      # API Configuration
      API_TITLE: "Enterprise Retail Intelligence System API"
      API_VERSION: "1.0.0"
      ENVIRONMENT: "production"
      DEBUG: "false"
      
      # Authentication
      SECRET_KEY: ${SECRET_KEY}
      JWT_EXPIRY: 86400
      
      # ML Configuration
      RAG_USE_OLLAMA: "true"
      RAG_OLLAMA_HOST: "http://ollama:11434"
      RAG_MODEL: "mistral"
      VECTOR_DB_PATH: "/app/data/chroma_db"
      
      # Causal Analysis
      ENABLE_CAUSAL_ANALYSIS: "true"
      CAUSAL_CACHE_DIR: "/app/data/causal_cache"
      
      # Forecasting
      PROPHET_SEASONALITY_MODE: "multiplicative"
      LSTM_EPOCHS: 100
      ENABLE_TRANSFER_LEARNING: "true"
      
      # Alerting
      ALERT_WEBHOOK_TIMEOUT: 5
      ALERT_DEDUP_WINDOW: 3600
      
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}
      LOGGING_LEVEL: "INFO"
    
    volumes:
      - ./backend:/app
      - shared-data:/app/data
      - ml-models:/app/models
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_started
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - eris-net
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Frontend React Service
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: eris-frontend-prod
    restart: always
    ports:
      - "443:443"
      - "80:80"
    environment:
      VITE_API_BASE_URL: "https://api.eris.local/api/v1"
      VITE_WS_URL: "wss://api.eris.local"
      NODE_ENV: "production"
    
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    
    depends_on:
      - backend
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - eris-net

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: eris-postgres-prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - eris-net
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: eris-redis-prod
    restart: always
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    
    volumes:
      - redis-data:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - eris-net

  # ============================================================================
  # Ollama (Free LLM Service)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: eris-ollama-prod
    restart: always
    ports:
      - "11434:11434"
    
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_NUM_THREAD: 8
    
    volumes:
      - ollama-data:/root/.ollama
      - ./models:/models
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - eris-net
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]  # Optional: if NVIDIA GPU available

  # ============================================================================
  # ChromaDB (Vector Database)
  # ============================================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: eris-chromadb-prod
    restart: always
    ports:
      - "8001:8000"
    
    environment:
      IS_PERSISTENT: "true"
      CHROMA_DB_IMPL: "duckdb+parquet"
      CHROMA_PERSISTENCE_DATA_PATH: "/data"
    
    volumes:
      - chromadb-data:/data
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - eris-net

  # ============================================================================
  # Monitoring - Prometheus
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: eris-prometheus-prod
    restart: always
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    
    networks:
      - eris-net

  # ============================================================================
  # Monitoring - Grafana
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: eris-grafana-prod
    restart: always
    ports:
      - "3000:3000"
    
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    depends_on:
      - prometheus
    
    networks:
      - eris-net

  # ============================================================================
  # Background Task Worker (Celery)
  # ============================================================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eris-celery-prod
    restart: always
    
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      RAG_OLLAMA_HOST: "http://ollama:11434"
    
    volumes:
      - ./backend:/app
      - shared-data:/app/data
    
    depends_on:
      - postgres
      - redis
      - ollama
    
    networks:
      - eris-net
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Beat Scheduler (Scheduled Tasks)
  # ============================================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eris-beat-prod
    restart: always
    
    command: celery -A app.tasks beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    
    volumes:
      - ./backend:/app
    
    depends_on:
      - postgres
      - redis
    
    networks:
      - eris-net

  # ── n8n Workflow Automation ──────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: eris-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: 5678
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://localhost:5678"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_NAME}
      DB_POSTGRESDB_USER: ${DB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-n8n-dev-key-change-in-prod}
      GENERIC_TIMEZONE: "Asia/Kolkata"
      N8N_LOG_LEVEL: info
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eris-net

# ============================================================================
# Networks
# ============================================================================
networks:
  eris-net:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  ollama-data:
    driver: local
  chromadb-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  shared-data:
    driver: local
  ml-models:
    driver: local
  n8n-data:
    driver: local
