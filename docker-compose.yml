version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Layer (Postgres 14)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: eris-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - eris_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'


  # ---------------------------------------------------------------------------
  # Cache Layer (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eris-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - eris_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'


  # ---------------------------------------------------------------------------
  # Backend Layer (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eris-backend
    ports:
      - "8000:8000"
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret must be set}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'


  # ---------------------------------------------------------------------------
  # Frontend Layer (Static Site)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: eris-frontend
    ports:
      - "3001:80"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.10'


  # ---------------------------------------------------------------------------
  # Reverse Proxy (Nginx)
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: eris-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - eris_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend


  # ---------------------------------------------------------------------------
  # Monitoring Layer (Prometheus)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: eris-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - eris_prometheus_data:/prometheus


# Removed custom network eris-network due to system-level iptables issues.
# Services will now use the default network.

volumes:
  eris_db_data:
  eris_redis_data:
  eris_prometheus_data:
  eris_logs:
