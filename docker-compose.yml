# ERIS with Docker Compose.
#
#   docker compose up --build                      # app on http://localhost:8000 (SQLite, demo data auto-generated)
#   docker compose --profile postgres up --build   # same, but PostgreSQL instead of SQLite
#   docker compose --profile ai up --build         # adds a local LLM (Ollama) for the assistant;
#                                                  # then: docker compose exec ollama ollama pull llama3.2:3b
services:
  eris:
    build: .
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-please-use-a-long-random-string}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/api/data/eris.db}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - eris-data:/app/api/data
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eris
      POSTGRES_PASSWORD: eris
      POSTGRES_DB: eris
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eris"]
      interval: 5s
      retries: 10

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama

volumes:
  eris-data:
  pg-data:
  ollama-data:
