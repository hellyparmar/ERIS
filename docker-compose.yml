version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Layer (Postgres 14)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: eris-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - eris_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'


  # ---------------------------------------------------------------------------
  # Cache Layer (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eris-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - eris_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'


  # ---------------------------------------------------------------------------
  # Backend Layer (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eris-backend
    network_mode: host
    restart: always
    command: >
      sh -c "alembic upgrade head && gunicorn -w 1 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8000 --timeout 120 --access-logfile - --error-logfile -"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret must be set}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DATA_DIR: ./data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eris-worker
    network_mode: host
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret must be set}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.api.celery_app worker --loglevel=info
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'


  # ---------------------------------------------------------------------------
  # Frontend Layer (Static Site)
  # ---------------------------------------------------------------------------


  # ---------------------------------------------------------------------------
  # Automation Workflow Layer (n8n)
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n
    container_name: eris-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - RDIOS_WEBHOOK_SECRET=rdios-n8n-secret
    volumes:
      - n8n_data:/home/node/.n8n
      - ./backend/n8n_workflows:/home/node/n8n_workflows
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: eris-frontend
    ports:
      - "3001:80"
    volumes:
      - ./dist-new:/usr/share/nginx/html:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.10'


  # ---------------------------------------------------------------------------
  # Reverse Proxy (Nginx)
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: eris-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - eris_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend



# Removed custom network eris-network due to system-level iptables issues.
# Services will now use the default network.

volumes:
  eris_db_data:
  eris_redis_data:
  eris_logs:
  n8n_data:
