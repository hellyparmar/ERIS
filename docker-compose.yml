services:
  # ---------------------------------------------------------------------------
  # Database Layer (Postgres 14)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: eris-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eris_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'


  # ---------------------------------------------------------------------------
  # Cache Layer (Valkey - open-source Redis-compatible server)
  # ---------------------------------------------------------------------------
  redis:
    image: valkey/valkey:8-alpine
    container_name: eris-valkey
    restart: always
    command: valkey-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - eris_redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'


  # ---------------------------------------------------------------------------
  # Backend Layer (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eris-backend
    restart: always
    command: >
      sh -c "alembic upgrade head && gunicorn -w 1 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8000 --timeout 120 --access-logfile - --error-logfile -"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Encryption key must be set}
      ERIS_SEED_PASSWORD: ${ERIS_SEED_PASSWORD:?Seed password must be set}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DATA_DIR: ./data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eris-worker
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Encryption key must be set}
      ERIS_SEED_PASSWORD: ${ERIS_SEED_PASSWORD:?Seed password must be set}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.api.celery_app worker --loglevel=info
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.50'


  # ---------------------------------------------------------------------------
  # Frontend Layer (Static Site)
  # ---------------------------------------------------------------------------


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: eris-frontend
    expose:
      - "80"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.10'


  # ---------------------------------------------------------------------------
  # Reverse Proxy (Nginx)
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: eris-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - eris_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend

volumes:
  eris_db_data:
  eris_redis_data:
  eris_logs:
